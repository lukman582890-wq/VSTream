name: Build VSTream VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S vst3-sender -B build -G "Visual Studio 18 2026" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundles = Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 |
            Where-Object { Test-Path (Join-Path $_.FullName "Contents") }
          foreach ($bundle in $bundles) {
            $dest = Join-Path "artifacts" $bundle.Name
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            Copy-Item $bundle.FullName -Destination $dest -Recurse -Force
          }
          $collected = Get-ChildItem -Path artifacts -Recurse -Directory -Filter *.vst3
          if (-not $collected) {
            Write-Error "No VST3 bundle was produced."
          }
          $collected | ForEach-Object { Write-Host "Collected VST3: $($_.FullName)" }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VSTream-VST3-Windows-x64
          path: artifacts/
