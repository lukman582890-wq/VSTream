name: Build VSTream VST3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S vst3-sender -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.vst3 | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts -Recurse -Force
          }
          if (-not (Get-ChildItem artifacts -Recurse -Filter *.vst3)) {
            Write-Error "No VST3 artifact was produced."
          }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VSTream-VST3-Windows-x64
          path: artifacts/
