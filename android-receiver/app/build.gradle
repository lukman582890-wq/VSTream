plugins { id 'com.android.application' }

android {
    namespace 'com.vstream.receiver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vstream.receiver'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndkVersion '27.2.12479018'

        externalNativeBuild {
            cmake { cppFlags '-std=c++17' }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}
